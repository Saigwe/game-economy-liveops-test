name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest (stats known answers, end-to-end readout, broken split) -> generate -> readout
        run: make test all
      - name: README charts render from the results
        run: python charts/make_charts.py
